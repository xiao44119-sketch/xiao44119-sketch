    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 132)">
      <rect width="256" height="86" rx="10" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#38BDF8">0-Dep</text>
      <text x="118" y="34" font-family="'SF Mono', monospace" font-size="11" fill="#94A3B8">NATIVE CODEC</text>
      <text x="20" y="64" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12.5" fill="#CBD5E1">自包含 libjycodec 直通剪映草稿</text>
    </g>

