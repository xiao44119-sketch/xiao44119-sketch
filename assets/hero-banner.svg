<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0A0F1A"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFD76A"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5D8"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5D8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD76A" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="82%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00E5D8" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGold" cx="18%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#FFD76A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowCyan)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glowGold)"/>

  <!-- Outer Frame -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="16.5" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- HUD Corner Accents -->
  <path d="M 20 36 L 20 20 L 44 20" fill="none" stroke="#00E5D8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1180 36 L 1180 20 L 1156 20" fill="none" stroke="#FFD76A" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 304 L 20 320 L 44 320" fill="none" stroke="#00E5D8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M 1180 304 L 1180 320 L 1156 320" fill="none" stroke="#FFD76A" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Top Telemetry Bar -->
  <g transform="translate(56, 36)">
    <rect x="0" y="0" width="276" height="26" rx="13" fill="#0F172A" stroke="#00E5D8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="13" r="4.5" fill="#00E5D8">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#00E5D8" letter-spacing="1.2">
      SYSTEM ONLINE // FINN.STUDIO
    </text>

    <text x="296" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#64748B" letter-spacing="1">
      [MODE: DETERMINISTIC_AI_ENGINE]   [CLEAN_FEED: ENABLED]
    </text>
  </g>

  <!-- Main Typography Left Column -->
  <g transform="translate(56, 118)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="url(#goldGrad)" letter-spacing="1">
      Finn · 骁清
    </text>

    <!-- Role Subtitle -->
    <text x="2" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="url(#cyanGrad)" letter-spacing="2.5">
      AI VISUAL DIRECTOR  ·  FULL-STACK AGENT ARCHITECT  ·  CREATIVE TECHNOLOGIST
    </text>

    <!-- Divider Line -->
    <line x1="2" y1="58" x2="680" y2="58" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="2" y1="58" x2="180" y2="58" stroke="#FFD76A" stroke-width="2">
      <animate attributeName="x2" values="120;260;120" dur="5s" repeatCount="indefinite"/>
    </line>

    <!-- Philosophical Quote -->
    <text x="2" y="92" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="500" fill="#E2E8F0" letter-spacing="0.8">
      “让想法被理解，也被实现。保持真实，让热爱有回响。”
    </text>
    <text x="2" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-style="italic" fill="#64748B" letter-spacing="0.5">
      "Make ideas understood, and make them happen. Stay authentic, let passion echo."
    </text>

    <!-- Bottom Pill Tags -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="168" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="84" y="18" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11.5" fill="#FFD76A" font-weight="600">🎬 Code-Driven Video</text>

      <rect x="180" y="0" width="176" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="268" y="18" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11.5" fill="#00E5D8" font-weight="600">✂️ JianYing Native Bus</text>

      <rect x="368" y="0" width="172" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="454" y="18" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11.5" fill="#38BDF8" font-weight="600">🤖 Multi-Agent Studio</text>

      <rect x="552" y="0" width="156" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="630" y="18" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11.5" fill="#F472B6" font-weight="600">❤️ Tech for Good</text>
    </g>
  </g>

  <!-- Right Column: Deterministic Mathematical Orbital Engine Visual -->
  <g transform="translate(985, 170)">
    <!-- Outer Radar Ring -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="96" fill="none" stroke="#00E5D8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="60 30 10 30">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#FFD76A" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="40 20">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="46" fill="#0A101D" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Crosshair lines -->
    <line x1="-130" y1="0" x2="-54" y2="0" stroke="#00E5D8" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="54" y1="0" x2="130" y2="0" stroke="#00E5D8" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="0" y1="-130" x2="0" y2="-54" stroke="#FFD76A" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="0" y1="54" x2="0" y2="130" stroke="#FFD76A" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Center Core Formula -->
    <text x="0" y="-4" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" font-weight="700" fill="#FFD76A">
      f(t) → Frame
    </text>
    <text x="0" y="14" text-anchor="middle" font-family="'SF Mono', monospace" font-size="9.5" fill="#00E5D8" letter-spacing="1">
      100% EXACT
    </text>

    <!-- Orbiting Node 1 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <circle cx="96" cy="0" r="5" fill="#00E5D8" filter="url(#softGlow)"/>
    </g>

    <!-- Orbiting Node 2 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="9s" repeatCount="indefinite"/>
      <circle cx="72" cy="0" r="4.5" fill="#FFD76A" filter="url(#softGlow)"/>
    </g>

    <!-- Telemetry Callouts -->
    <g transform="translate(-155, -108)">
      <rect x="0" y="0" width="96" height="22" rx="4" fill="#0F172A" stroke="#00E5D8" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="48" y="14.5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#00E5D8">FPS: 30 / 60</text>
    </g>
    <g transform="translate(64, 88)">
      <rect x="0" y="0" width="104" height="22" rx="4" fill="#0F172A" stroke="#FFD76A" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="52" y="14.5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#FFD76A">1080 × 1920</text>
    </g>
  </g>
</svg>
